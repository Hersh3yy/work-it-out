name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, pdo_sqlite, redis
          coverage: none
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit
        run: composer audit
      - name: Pint
        run: vendor/bin/pint --test
      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate
      - name: Pest
        run: php artisan test --compact

  # Production runs Postgres; SQLite hides type mismatches (an integer morph id
  # against ULID keys passed on SQLite and failed on a real engine).
  pest-pgsql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, pdo_pgsql, redis
          coverage: none
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate
      - name: Pest on Postgres
        run: vendor/bin/pest --compact --configuration=phpunit.pgsql.xml
