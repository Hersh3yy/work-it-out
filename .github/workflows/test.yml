name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite, redis
          coverage: none
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit
        run: composer audit
      - name: Pint
        run: vendor/bin/pint --test
      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate
      - name: Pest
        run: php artisan test --compact

  # Production runs MySQL; SQLite hides type mismatches (an integer morph id
  # against ULID keys passed on SQLite and was a 500 on MySQL).
  pest-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, redis
          coverage: none
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate
      - name: Pest on MySQL
        run: vendor/bin/pest --compact --configuration=phpunit.mysql.xml
