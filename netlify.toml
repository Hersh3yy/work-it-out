# Netlify builds the Nuxt app in client/ as a static site.
# Site settings in Netlify: link this repo, branch master; the values below
# replace the UI build settings. Environment variables (Site configuration >
# Environment variables): NUXT_PUBLIC_API_BASE=https://<api host>/api and
# NUXT_PUBLIC_TELEGRAM_BOT=<bot username>. They are baked in at build time.
[build]
  base    = "client"
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
