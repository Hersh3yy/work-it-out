# Auto-loaded by Docker Compose for local development.
# Production deploys (Coolify) use Dockerfile directly — this file is ignored there.
services:
  app:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - bootstrap-cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8088
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Reachable from this laptop only (127.0.0.1), never from the network.
  postgres:
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - feetness

volumes:
  vendor-data:
    driver: local
  bootstrap-cache:
    driver: local
