; The official php-fpm image ships zz-docker.conf with "listen = 9000", which
; binds every interface. Pool files load in name order, so this zzz- file wins.
; nginx in the same container is the only client: 127.0.0.1 only.
; (A previous VPS was taken over through an exposed php-fpm on port 9000.)
[www]
listen = 127.0.0.1:9000
