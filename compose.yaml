services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    env_file:
      - .env
    environment:
      # Override DB / Redis hosts to match Docker service names.
      # These override any values in .env for the containerised stack.
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - feetness
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: work_it_out
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail -d work_it_out"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - feetness
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - feetness
    restart: unless-stopped

volumes:
  postgres18-data:
    driver: local
  redis-data:
    driver: local

networks:
  feetness:
    driver: bridge
